<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéStore - Tu Tienda de Pokémon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --dark-bg: #1a1a2e;
            --card-bg: #16213e;
            --text-light: #eee;
            --text-dark: #333;
            --accent: #ffd93d;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }

            to {
                transform: translateY(0);
            }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .cart-icon:hover {
            transform: scale(1.2);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        /* Main Content */
        main {
            margin-top: 80px;
            padding: 2rem 5%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 0;
            perspective: 1000px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotateX(0);
            }

            50% {
                transform: translateY(-20px) rotateX(5deg);
            }
        }

        .hero p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        /* Search and Filters */
        .search-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            border: none;
            border-radius: 50px;
            background: var(--card-bg);
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .search-box i {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .filter-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            background: var(--card-bg);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .filter-btn:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .filter-btn.active {
            background: var(--primary-color);
        }

        /* Pokemon Grid */
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .pokemon-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pokemon-card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.3);
        }

        .pokemon-image {
            width: 150px;
            height: 150px;
            margin: 0 auto 1rem;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate3d 10s linear infinite;
        }

        @keyframes rotate3d {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        .pokemon-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        .pokemon-name {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .pokemon-type {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 0.2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .pokemon-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 1rem 0;
        }

        .add-to-cart {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .add-to-cart::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .add-to-cart:hover::before {
            width: 300px;
            height: 300px;
        }

        .add-to-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .cart-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close-cart {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light);
            transition: transform 0.3s ease;
        }

        .close-cart:hover {
            transform: rotate(90deg);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideInLeft 0.3s ease;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .cart-total {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--accent), var(--primary-color));
            color: var(--dark-bg);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 217, 61, 0.4);
        }

        /* Floating Elements */
        .floating-pokeball {
            position: fixed;
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #ff0000, #ffffff);
            border-radius: 50%;
            opacity: 0.1;
            animation: floatAround 20s infinite linear;
            pointer-events: none;
        }

        @keyframes floatAround {
            0% {
                transform: translate(0, 100vh) rotate(0deg);
            }

            100% {
                transform: translate(100vw, -100px) rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .nav-links {
                display: none;
            }

            .pokemon-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Pokeballs -->
    <div class="floating-pokeball" style="left: 10%; animation-delay: 0s;"></div>
    <div class="floating-pokeball" style="left: 30%; animation-delay: 5s;"></div>
    <div class="floating-pokeball" style="left: 50%; animation-delay: 10s;"></div>
    <div class="floating-pokeball" style="left: 70%; animation-delay: 15s;"></div>

    <!-- Header -->
    <header>
        <nav>
            <div class="logo">PokéStore</div>
            <ul class="nav-links">
                <li><a href="#home">Inicio</a></li>
                <li><a href="#pokemon">Pokémon</a></li>
                <li><a href="#about">Sobre Nosotros</a></li>
                <li><a href="#contact">Contacto</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <h1>Captura tus Pokémon Favoritos</h1>
            <p>Descubre la colección más grande de Pokémon a precios increíbles</p>
        </section>

        <!-- Search and Filters -->
        <section class="search-filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar Pokémon..." onkeyup="filterPokemon()">
                <i class="fas fa-search"></i>
            </div>
            <button class="filter-btn active" onclick="filterByType('all')">Todos</button>
            <button class="filter-btn" onclick="filterByType('fuego')">Fuego</button>
            <button class="filter-btn" onclick="filterByType('agua')">Agua</button>
            <button class="filter-btn" onclick="filterByType('planta')">Planta</button>
            <button class="filter-btn" onclick="filterByType('eléctrico')">Eléctrico</button>
        </section>

        <!-- Pokemon Grid -->
        <section class="pokemon-grid" id="pokemonGrid">
            <!-- Pokemon cards will be generated by JavaScript -->
        </section>
    </main>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <span class="close-cart" onclick="toggleCart()">&times;</span>
            <h2>Tu Carrito</h2>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal">Total: $0</div>
            <button class="checkout-btn" onclick="checkout()">Proceder al Pago</button>
        </div>
    </div>

    <script>
        // Pokemon data
        const pokemonData = [
            {
                id: 1,
                name: "Pikachu",
                type: ["eléctrico"],
                price: 150,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
            },
            {
                id: 2,
                name: "Charizard",
                type: ["fuego", "volador"],
                price: 500,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png"
            },
            {
                id: 3,
                name: "Blastoise",
                type: ["agua"],
                price: 450,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png"
            },
            {
                id: 4,
                name: "Venusaur",
                type: ["planta", "veneno"],
                price: 400,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png"
            },
            {
                id: 5,
                name: "Gengar",
                type: ["fantasma", "veneno"],
                price: 350,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png"
            },
            {
                id: 6,
                name: "Dragonite",
                type: ["dragón", "volador"],
                price: 600,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/149.png"
            },
            {
                id: 7,
                name: "Mewtwo",
                type: ["psíquico"],
                price: 800,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png"
            },
            {
                id: 8,
                name: "Mew",
                type: ["psíquico"],
                price: 1000,
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/151.png"
            }
        ];

        let cart = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderPokemon(pokemonData);
            updateCartCount();
        });

        // Render Pokemon
        function renderPokemon(pokemon) {
            const grid = document.getElementById('pokemonGrid');
            grid.innerHTML = '';

            pokemon.forEach((poke, index) => {
                const card = document.createElement('div');
                card.className = 'pokemon-card';
                card.style.animationDelay = ${ index * 0.1 } s;

                const types = poke.type.map(t => <span class="pokemon-type">${t}</span>).join('');

                card.innerHTML = `
                    <div class="pokemon-image">
                        <img src="${poke.image}" alt="${poke.name}">
                    </div>
                    <h3 class="pokemon-name">${poke.name}</h3>
                    <div class="pokemon-types">${types}</div>
                    <div class="pokemon-price">$${poke.price}</div>
                    <button class="add-to-cart" onclick="addToCart(${poke.id})">
                        <i class="fas fa-cart-plus"></i> Añadir al Carrito
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        // Add to cart
        function addToCart(pokemonId) {
            const pokemon = pokemonData.find(p => p.id === pokemonId);
            const existingItem = cart.find(item => item.id === pokemonId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...pokemon, quantity: 1 });
            }

            updateCartCount();
            showNotification(${ pokemon.name } añadido al carrito!);
        }

        // Update cart count
        function updateCartCount() {
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // Toggle cart
        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            renderCart();
        }

        // Render cart
        function renderCart() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; padding: 2rem;">Tu carrito está vacío</p>';
                cartTotal.textContent = 'Total: $0';
                return;
            }

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div style="flex: 1;">
                        <h4>${item.name}</h4>
                        <p>$${item.price} x ${item.quantity}</p>
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="background: var(--primary-color); border: none; color: white; padding: 0.5rem; border-radius: 5px; cursor: pointer;">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = Total: $${ total };
        }

        // Remove from cart
        function removeFromCart(pokemonId) {
            cart = cart.filter(item => item.id !== pokemonId);
            updateCartCount();
            renderCart();
        }

        // Filter by type
        function filterByType(type) {
            currentFilter = type;

            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter pokemon
            let filtered = pokemonData;
            if (type !== 'all') {
                filtered = pokemonData.filter(p => p.type.includes(type));
            }

            renderPokemon(filtered);
        }

        // Search pokemon
        function filterPokemon() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filtered = pokemonData;

            if (searchTerm) {
                filtered = pokemonData.filter(p =>
                    p.name.toLowerCase().includes(searchTerm)
                );
            }

            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.type.includes(currentFilter));
            }

            renderPokemon(filtered);
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                showNotification('Tu carrito está vacío');
                return;
            }

            showNotification('¡Gracias por tu compra! Redirigiendo al pago...');
            setTimeout(() => {
                cart = [];
                updateCartCount();
                toggleCart();
            }, 2000);
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: var(--primary-color);
                color: white;
                padding: 1rem 2rem;
                border-radius: 10px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.3);
                z-index: 3000;
                animation: slideInRight 0.3s ease;
            `;
            notification.textContent = message;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Add slide animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Close cart when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('cartModal');
            if (event.target === modal) {
                toggleCart();
            }
        }
    </script>
</body>

</html>
